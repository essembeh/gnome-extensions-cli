[project]
name = "gnome-extensions-cli"
version = "0.11.0"
description = "Command line tool to manage your Gnome Shell extensions"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Sébastien MB", email = "seb@essembeh.org" }]
# Published CLI: Debian stable ships 3.13, 3.12 is the oldest version still worth supporting.
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "colorama>=0.4.5",
    "packaging>=25.0",
    "pydantic>=2.3.0",
    "requests>=2.28.1",
    "tqdm>=4.66.1",
]

[project.urls]
Homepage = "https://github.com/essembeh/gnome-extensions-cli"
Repository = "https://github.com/essembeh/gnome-extensions-cli"
Issues = "https://github.com/essembeh/gnome-extensions-cli/issues"

[project.scripts]
gnome-extensions-cli = "gnome_extensions_cli.cli:run"
gext = "gnome_extensions_cli.cli:run"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.19",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "ruff>=0.16",
    "types-colorama>=0.4.15.20260508",
    "types-requests",
    "types-tqdm",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade (follows requires-python)
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
    "ASYNC", # flake8-async
    "S",     # flake8-bandit
]

[tool.ruff.lint.per-file-ignores]
# `assert` is the normal pytest mechanism, not a production assert.
"tests/**" = ["S101"]
# This backend drives GNOME tools (gsettings, gnome-shell, ...) found on PATH with fixed argv lists.
"src/gnome_extensions_cli/filesystem.py" = ["S603", "S607"]

[tool.mypy]
strict = true
warn_unreachable = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# PyGObject ships no stubs and is only importable where Nix/apt provides it.
module = ["gi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["gnome_extensions_cli"]
